name: BTC Bot Kagit Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "results/**"
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"   # ~15 dakikada bir (GitHub bazen birkaç dakika geciktirir)

permissions:
  contents: write

concurrency:
  group: btc-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: On kayit sunucu zamani
        run: |
          if [ -f docs/ON_KAYIT_v1.md ] && [ ! -f docs/ON_KAYIT_v1_zaman.txt ]; then
            {
              echo "Dosya: docs/ON_KAYIT_v1.md"
              echo "SHA-256: $(sha256sum docs/ON_KAYIT_v1.md | cut -d' ' -f1)"
              echo "Commit: $(git log -1 --format=%H)"
              echo "Commit zamani (git): $(git log -1 --format=%cI)"
              echo "GitHub Actions sunucu zamani (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Calistirma: $GITHUB_RUN_ID / olay: $GITHUB_EVENT_NAME / depo: $GITHUB_REPOSITORY"
            } > docs/ON_KAYIT_v1_zaman.txt
            cat docs/ON_KAYIT_v1_zaman.txt
          fi

      - name: Botu bir adim calistir
        run: python -m bot.main

      - name: Sonuclari kaydet
        run: |
          git config user.name "btc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          [ -f docs/ON_KAYIT_v1_zaman.txt ] && git add docs/ON_KAYIT_v1_zaman.txt
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "Bot raporu $(TZ=Europe/Istanbul date '+%d.%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort; sleep 5; continue; }
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
